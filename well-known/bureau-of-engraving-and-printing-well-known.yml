description: >-
  Well-known document probe across every host the Bureau of Engraving and Printing
  controls — the primary Drupal site www.bep.gov, its apex bep.gov, and the legacy
  moneyfactory.gov domain the agency still owns. NOTHING was found. No RFC 9116
  security.txt, no OpenID Connect discovery document, no OAuth authorization-server
  metadata, no RFC 9727 api-catalog and no ai-plugin.json is served on any of them.
  This file records a measured absence, not a finding — no WellKnown or SecurityTxt
  pointer is wired into apis.yml, because BEP publishes none of these documents.
note: >-
  Two false-positive shapes were ruled out. (1) The apex bep.gov and both
  moneyfactory.gov hosts answer EVERY path with a 302 to the site homepage, so a
  redirect-following probe reads 200 + a 45KB HTML homepage for /.well-known/anything;
  that is a catch-all redirect, not a document. (2) www.bep.gov returns a real 404
  status but serves the full 25KB Drupal 404 page as the body for most paths. Only the
  status codes below, captured WITHOUT following redirects, are the truth.
