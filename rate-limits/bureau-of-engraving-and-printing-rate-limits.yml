description: >-
  The Bureau of Engraving and Printing publishes no rate limits, because it publishes no
  API. No BEP-controlled host (www.bep.gov, bep.gov, moneyfactory.gov) exposes an API
  endpoint, so no quota, window, burst ceiling, response header or exhaustion status code
  could be read or observed. limit_count is 0 as a measured fact.
limit_count: 0
limits: []
headers: {}
headers_note: >-
  No X-RateLimit-*, RateLimit-* or Retry-After signaling could be observed. The only
  anonymous responses available from BEP are Drupal-rendered HTML pages on www.bep.gov
  and catch-all 302s on the apex and legacy domains.
responseCodes: {}
policies: []
notes:
  - >-
    This file previously carried five invented tiers (10/100/1000 requests per minute,
    1,000 and 100,000 requests per month) and a complete X-RateLimit-* header set,
    written by the 2026-05-04 bulk sweep. None of it was published by BEP and all of it
    has been removed.
