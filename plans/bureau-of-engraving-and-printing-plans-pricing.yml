description: >-
  The Bureau of Engraving and Printing publishes no API plans and no API pricing, because
  it publishes no API. BEP is a U.S. Department of the Treasury manufacturing bureau: it
  prints Federal Reserve notes and other government security documents. Its two public
  services — the U.S. Currency Reader Program and Mutilated Currency Redemption — are
  free-of-charge citizen services delivered by paper application and postal mail, not
  metered API products. There is no developer portal, no sign-up, no tier, no quota and
  no price on any BEP-controlled host. plan_count is 0 as a measured fact, not a gap.
plan_count: 0
