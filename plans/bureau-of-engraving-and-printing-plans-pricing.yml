access_model:
  self_serve: false
  free_tier: false
  trial: false
  public_signup: false
  gate: none
  onboarding: >-
    Not applicable. The U.S. Currency Reader Program is requested with a paper/PDF
    application form mailed to the National Library Service for the Blind and Print
    Disabled; mutilated currency is redeemed by shipping the damaged notes to BEP's
    Mutilated Currency Division. Both services are free to the citizen and neither is
    programmatically accessible.
  contact: https://www.bep.gov/contact-us
notes:
  - >-
    This file previously carried a three-tier Free/Professional/Enterprise scaffold with
    invented quotas (1,000 and 100,000 requests per month), invented rate ceilings and
    TBD prices, written by the 2026-05-04 bulk sweep. BEP has never published any of it
    and it has been removed.
  - >-
    BEP's only free-tier-shaped published artifacts are the EyeNote mobile apps for iOS
    and Android — free end-user currency identifiers, not an API product with a plan.
